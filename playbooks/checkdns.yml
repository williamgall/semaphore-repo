---
- name: Verify DNS configuration
  hosts: all
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: auto_silent
    dns_primary: "192.168.0.53"
    dns_secondary: "192.168.0.49"

  tasks:
    - name: Read configured nameservers
      ansible.builtin.shell: |
        awk '/^nameserver/ {print $2}' /etc/resolv.conf
      register: nameservers
      changed_when: false

    - name: Check primary DNS
      ansible.builtin.set_fact:
        primary_ok: "{{ dns_primary in nameservers.stdout_lines }}"

    - name: Check secondary DNS
      ansible.builtin.set_fact:
        secondary_ok: "{{ dns_secondary in nameservers.stdout_lines }}"

    - name: DNS verification result
      ansible.builtin.debug:
        msg: "{{ 'PASS' if primary_ok and secondary_ok else 'FAIL' }} | DNS: {{ nameservers.stdout_lines | join(', ') }}"
